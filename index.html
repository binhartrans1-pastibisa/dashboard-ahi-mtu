<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AHI MTU</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
}

/* HEADER */

.header {
    background: #111827;
    color: white;
    padding: 22px 30px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 6px 0 0;
    color: #9ca3af;
}

/* CONTAINER */

.container {
    max-width: 1500px;
    margin: auto;
    padding: 25px;
}

/* CARDS */

.cards {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 20px;

    margin-bottom: 25px;
}

.card {

    background: white;

    padding: 20px;

    border-radius: 12px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);
}

.card-title {

    color: #6b7280;

    font-size: 14px;
}

.card-value {

    font-size: 34px;

    font-weight: bold;

    margin-top: 8px;
}

.good {
    color: #16a34a;
}

.fair {
    color: #ca8a04;
}

.poor {
    color: #ea580c;
}

.critical {
    color: #dc2626;
}

/* TOOLBAR */

.toolbar {

    background: white;

    padding: 15px;

    border-radius: 12px;

    margin-bottom: 20px;
}

input,
select {

    padding: 11px;

    border: 1px solid #d1d5db;

    border-radius: 7px;

    margin-right: 10px;

    font-size: 14px;
}

/* GI */

.gi {

    background: white;

    border-radius: 12px;

    margin-bottom: 18px;

    overflow: hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.07);
}

.gi-header {

    padding: 16px 20px;

    background: #f9fafb;

    display: flex;

    justify-content: space-between;

    font-weight: bold;
}

/* TABLE */

table {

    width: 100%;

    border-collapse: collapse;
}

th {

    background: #f1f3f5;

    text-align: left;

    padding: 13px;

    font-size: 13px;
}

td {

    padding: 13px;

    border-top: 1px solid #e5e7eb;
}

/* STATUS */

.status {

    display: inline-block;

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;
}

.status-GOOD {

    background: #dcfce7;

    color: #166534;
}

.status-FAIR {

    background: #fef9c3;

    color: #854d0e;
}

.status-POOR {

    background: #ffedd5;

    color: #9a3412;
}

.status-CRITICAL {

    background: #fee2e2;

    color: #991b1b;
}

/* LOADING */

.loading {

    text-align: center;

    padding: 40px;

    font-size: 18px;
}

/* MOBILE */

@media(max-width:800px) {

    .cards {

        grid-template-columns:
            repeat(2, 1fr);
    }

}

</style>

</head>


<body>


<div class="header">

<h1>AHI MTU</h1>

<p>
Dashboard Health Index Material Transmisi Utama
</p>

</div>


<div class="container">


<!-- SUMMARY -->

<div class="cards">

<div class="card">

<div class="card-title">
GOOD
</div>

<div
id="good"
class="card-value good">

0

</div>

</div>


<div class="card">

<div class="card-title">
FAIR
</div>

<div
id="fair"
class="card-value fair">

0

</div>

</div>


<div class="card">

<div class="card-title">
POOR
</div>

<div
id="poor"
class="card-value poor">

0

</div>

</div>


<div class="card">

<div class="card-title">
CRITICAL
</div>

<div
id="critical"
class="card-value critical">

0

</div>

</div>

</div>


<!-- FILTER -->

<div class="toolbar">

<input

id="search"

type="text"

placeholder="🔍 Cari peralatan..."

onkeyup="renderData()">

<select
id="statusFilter"
onchange="renderData()">

<option value="">
Semua Status
</option>

<option value="GOOD">
GOOD
</option>

<option value="FAIR">
FAIR
</option>

<option value="POOR">
POOR
</option>

<option value="CRITICAL">
CRITICAL
</option>

</select>

</div>


<!-- DATA -->

<div id="dataContainer">

<div class="loading">

⏳ Mengambil data...

</div>

</div>


</div>


<script>


/* API GOOGLE SHEETS */

const API_URL =
"https://script.google.com/macros/s/AKfycbwQYMWd6PGFV60pX48_ABQhsubgKP04J7qh8IsRptKTtxQ1wYTZ2Y9ZlrLXPIIqPqZ_Dw/exec";


let data = [];


/* AMBIL DATA */

fetch(API_URL)

.then(response => response.json())

.then(result => {

    data = result;

    updateSummary();

    renderData();

})

.catch(error => {

    document.getElementById(
        "dataContainer"
    ).innerHTML =

    "<div class='loading'>❌ Gagal mengambil data</div>";

    console.error(error);

});


/* SUMMARY */

function updateSummary() {

    document.getElementById("good").innerText =
        data.filter(x => x.STATUS === "GOOD").length;

    document.getElementById("fair").innerText =
        data.filter(x => x.STATUS === "FAIR").length;

    document.getElementById("poor").innerText =
        data.filter(x => x.STATUS === "POOR").length;

    document.getElementById("critical").innerText =
        data.filter(x => x.STATUS === "CRITICAL").length;

}


/* RENDER */

function renderData() {

    const search =
        document.getElementById(
            "search"
        ).value.toLowerCase();

    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const filtered =
        data.filter(item => {

            const text =
                Object.values(item)
                .join(" ")
                .toLowerCase();

            return (

                text.includes(search)

                &&

                (
                    status === ""

                    ||

                    item.STATUS === status
                )

            );

        });


    /* GROUP BY GI */

    const groups = {};


    filtered.forEach(item => {

        if (!groups[item.GI]) {

            groups[item.GI] = [];

        }

        groups[item.GI].push(item);

    });


    let html = "";


    Object.keys(groups).forEach(gi => {

        const items = groups[gi];


        const statuses =
            items.map(x => x.STATUS);


        let giStatus = "GOOD";


        if (statuses.includes("CRITICAL")) {

            giStatus = "CRITICAL";

        }

        else if (statuses.includes("POOR")) {

            giStatus = "POOR";

        }

        else if (statuses.includes("FAIR")) {

            giStatus = "FAIR";

        }


        html += `

        <div class="gi">

            <div class="gi-header">

                <span>
                ▼ ${gi}
                </span>

                <span>

                ${items.length} MTU

                —

                <span class="status status-${giStatus}">

                ${giStatus}

                </span>

                </span>

            </div>


            <table>

                <thead>

                    <tr>

                        <th>Jenis</th>

                        <th>Peralatan</th>

                        <th>Fasa</th>

                        <th>Tahun</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody>
        `;


        items.forEach(item => {

            html += `

            <tr>

                <td>
                ${item.JENIS}
                </td>

                <td>
                ${item.PERALATAN}
                </td>

                <td>
                ${item.FASA}
                </td>

                <td>
                ${item.TAHUN}
                </td>

                <td>

                    <span
                    class="status status-${item.STATUS}">

                    ${item.STATUS}

                    </span>

                </td>

            </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        </div>

        `;

    });


    document.getElementById(
        "dataContainer"
    ).innerHTML =

        html ||

        "<div class='loading'>Data tidak ditemukan</div>";

}

</script>


</body>

</html>
